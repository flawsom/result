name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This repository is Bun-managed: bun.lock is the lockfile that matches
      # package.json. A stale package-lock.json is also checked in, and installing
      # from it pulled a Prettier older than the one any local run uses, so this
      # job reported formatting errors in files that are in fact correctly
      # formatted. Installing with Bun makes CI and a local run agree.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Type-check & build
        run: bun run build
