name: BPUT census

# The crawl runs here instead of in somebody's browser tab. Every run is one
# bounded slice of a declared registration-number range, and it resumes from the
# offset the previous run persisted in the database. A missed run therefore costs
# progress, never correctness, and no run depends on a tab staying open.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   Variables: CENSUS_RANGE_START, CENSUS_RANGE_END    — the range to walk
#   Secrets:   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — writes need the service role
#
# Until a range is set, each scheduled run exits in seconds after the config
# check below. Nothing is collected and nothing is broken — it just waits.
#
# Cadence: the repository is public, so Actions minutes are unmetered and the
# crawl is limited by what the portal will tolerate rather than by a CI budget.
# A fresh tick therefore starts every five minutes and walks for most of them,
# which is about as continuous as a scheduler gets. `concurrency` below means a
# slow tick delays the next start instead of piling runs on top of each other.
#
# The real limit is the upstream pace, not the runner: at the default 1s delay a
# student costs nine requests (one record plus eight semesters), so roughly seven
# students a minute is the sustained ceiling however often this fires. Lower
# CENSUS_RATE_MS to raise it, and watch for 429s in the log if you do.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      range_start:
        description: First registration number in the range (overrides the variable)
        required: false
      range_end:
        description: Last registration number in the range (overrides the variable)
        required: false
      seconds:
        description: Wall-clock budget for this run, in seconds (max ~21000)
        required: false
        default: "3000"
      rate_ms:
        description: Delay before each upstream request, in milliseconds
        required: false
        default: "1000"

# One tick at a time. Two overlapping ticks would interleave flushes against the
# same cursor, which is recoverable but pointless. Not cancelling in progress
# means a long dispatch run finishes rather than being cut off by the schedule.
concurrency:
  group: bput-census
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Nothing below is needed to decide whether a crawl is configured, so this
      # runs first and an unconfigured hour costs seconds rather than a checkout.
      - name: Check census configuration
        id: config
        env:
          CENSUS_RANGE_START: ${{ inputs.range_start || vars.CENSUS_RANGE_START }}
        run: |
          if [ -n "$CENSUS_RANGE_START" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Census range not set::Add repository variables CENSUS_RANGE_START and CENSUS_RANGE_END to begin the crawl."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      # No dependency install: the tick imports only its own TypeScript, so Bun
      # runs it directly and the job stays short.
      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.configured == 'true'
        with:
          bun-version: latest

      - name: Run one census slice
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_RANGE_START: ${{ inputs.range_start || vars.CENSUS_RANGE_START }}
          CENSUS_RANGE_END: ${{ inputs.range_end || vars.CENSUS_RANGE_END }}
          CENSUS_SECONDS: ${{ inputs.seconds || '270' }}
          CENSUS_RATE_MS: ${{ inputs.rate_ms || '1000' }}
        run: bun scripts/census-tick.mjs
