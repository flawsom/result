name: BPUT census

# The crawl runs here instead of in somebody's browser tab. Each run walks a slice
# of the measured registration-number grid in src/lib/census-blocks.ts, every
# batch year (2012–2025) × every college code that has one, which is 1,103 blocks
#, and resumes each block from the offset the previous run persisted. A missed
# run therefore costs progress, never correctness, and no run depends on a tab
# staying open.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   Secret: SUPABASE_URL             , project URL (or a variable of the same name)
#   Secret: SUPABASE_SERVICE_ROLE_KEY, writes need the service role; the census
#                                       RPCs deliberately refuse an anonymous caller
#
# Nothing else is required: the grid is committed, not configured. To crawl a
# subset, set CENSUS_YEARS (e.g. `23,24,25`) as a repository variable.
#
# TRIGGERS, why there are three
# ------------------------------
# `schedule` is the driver. It fired exactly once in this workflow's life
# (2026-09-29T01:11Z) while reporting itself `active`, and the repository had no
# commit for the 71 days before that, past GitHub's sixty-day threshold for
# automatically disabling scheduled workflows. That is the whole cause, and it is
# fixed from the other side: census-refresh.yml runs daily and commits, so the
# repository is never inactive long enough for the schedule to be disabled again,
# and it dispatches a slice directly as a second path in case it ever is.
#
# So the schedule is not the only trigger:
#   push  , a change to the crawler verifies itself on real data in five minutes
#   dispatch, a human, or the daily refresh job, can start a slice at any time
#
# And since a job may run for six hours while public-repository minutes are
# unmetered, a *scheduled* run takes a five-and-a-half-hour slice rather than a
# short one. With the schedule firing every five minutes and a run taking five and
# a half hours, the concurrency group below keeps one slice running back to back
# with the next already queued, which is how a two-day census actually finishes in
# two days. A run killed by the ceiling loses at most the unflushed batch, because
# the cursor is written every fifteen seconds.
#
# PACING, the number that decides how long the whole thing takes
# --------------------------------------------------------------
# Pacing is an aggregate requests-per-second ceiling (`CENSUS_MAX_RPS`), not a
# per-request sleep, because with several workers a sleep makes the real rate an
# accident of latency. Measured on 2026-09-29 against results.bput.ac.in:
# p50 291 ms, p95 1,074 ms, and 12 concurrent workers with no delay sustained
# 35.6 req/s for 45 s with zero 429s. A 16-worker run could not exceed a 16 req/s
# ceiling, which is the point of the governor: the ceiling binds, not the network.
#
# The default ceiling is 16 req/s, deliberately under a 45-second observation,
# because this runs for a day and the portal is somebody else's server. Raise it
# with the `max_rps` input when dispatching; the governor ramps up from a quarter
# of the ceiling and halves on any 429 with a five-second cooldown across all
# workers, so raising it is a bet that pays out and self-corrects.
#
# MEASURED, and the reason the default concurrency is 16 rather than 8: this crawl
# is latency-bound, so the real throughput is workers / latency, and the ceiling is
# mostly a safety rail. Against the live portal, zero 429s throughout:
#     8 workers → 3.8 req/s      24 workers → 7.4 req/s
# A student costs 9 requests (1 record + 8 semesters) and `subjects` answers in
# ~797 ms, so more workers is the only real lever, up to a point, since the portal
# queues under parallelism. At the measured 7.4 req/s the 1.45 M requests the grid
# is measured to need (158,571 students across 1,103 blocks, ~17 probes per block
# already spent to weigh them) take roughly two days.

on:
  schedule:
    - cron: "*/5 * * * *"

  push:
    branches: [main]
    paths:
      - "src/lib/census-*.ts"
      - "src/lib/bput-upstream.ts"
      - "scripts/census-tick.mjs"
      - ".github/workflows/census.yml"

  workflow_dispatch:
    inputs:
      years:
        description: Batch years to crawl, e.g. "23,24,25". Empty means all 14.
        required: false
      range_start:
        description: Optional single-range override, first registration number
        required: false
      range_end:
        description: Optional single-range override, last registration number
        required: false
      seconds:
        description: Wall-clock budget for this run, in seconds (job ceiling ~20000)
        required: false
        default: "19800"
      max_rps:
        description: Aggregate request ceiling in requests/second (measured safe >35)
        required: false
        default: "16"
      concurrency:
        description: Workers, each walking one college-year block at a time (1–32)
        required: false
        default: "16"
      max_blocks:
        description: Start at most this many blocks this run (0 = no cap)
        required: false
        default: "0"

# One tick at a time. Two overlapping ticks would interleave flushes against the
# same cursors, which is recoverable but pointless. Not cancelling in progress
# means a long slice finishes rather than being cut off by the next trigger.
concurrency:
  group: bput-census
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Nothing below is needed to decide whether a crawl is configured, so this
      # runs first and a misconfigured hour costs seconds rather than a checkout.
      - name: Check census credentials
        id: config
        env:
          HAVE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          HAVE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$HAVE_URL" ] && [ -n "$HAVE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Census credentials missing::Add repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to begin the crawl."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      # No dependency install: the tick imports only its own TypeScript, so Bun
      # runs it directly and the job stays short.
      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.configured == 'true'
        with:
          bun-version: latest

      - name: Walk one census slice
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_YEARS: ${{ inputs.years || vars.CENSUS_YEARS }}
          CENSUS_RANGE_START: ${{ inputs.range_start }}
          CENSUS_RANGE_END: ${{ inputs.range_end }}
          # A push verifies in five minutes; a scheduled run works for five and a
          # half hours; a manual dispatch decides for itself.
          CENSUS_SECONDS: ${{ github.event_name == 'push' && 300 || inputs.seconds || 19800 }}
          CENSUS_MAX_RPS: ${{ inputs.max_rps || '16' }}
          CENSUS_CONCURRENCY: ${{ inputs.concurrency || vars.CENSUS_CONCURRENCY || '16' }}
          CENSUS_ADAPTIVE: ${{ vars.CENSUS_ADAPTIVE || '1' }}
          CENSUS_MAX_BLOCKS: ${{ inputs.max_blocks || '0' }}
        run: bun scripts/census-tick.mjs
