name: BPUT census

# The crawl runs here instead of in somebody's browser tab. Each run walks a slice
# of the measured registration-number grid in src/lib/census-blocks.ts — every
# batch year (2012–2025) × every college code that has one, which is 1,103 blocks
# — and resumes each block from the offset the previous run persisted. A missed
# run therefore costs progress, never correctness, and no run depends on a tab
# staying open.
#
# Required repository configuration (Settings → Secrets and variables → Actions):
#   Secret: SUPABASE_URL              — project URL (or a variable of the same name)
#   Secret: SUPABASE_SERVICE_ROLE_KEY — writes need the service role; the census
#                                       RPCs deliberately refuse an anonymous caller
#
# Nothing else is required: the grid is committed, not configured. To crawl a
# subset, set CENSUS_YEARS (e.g. `23,24,25`) as a repository variable.
#
# PACING — the number that decides how long this takes
# ----------------------------------------------------
# Pacing is an aggregate requests-per-second ceiling (`CENSUS_MAX_RPS`), not a
# per-request sleep, because with several workers a sleep makes the real rate an
# accident of latency. Measured on 2026-09-29 against results.bput.ac.in:
# p50 291 ms, p95 1,074 ms, and 12 concurrent workers with no delay sustained
# 35.6 req/s for 45 s with zero 429s.
#
# The default ceiling is 16 req/s, deliberately well under a 45-second
# observation, because this crawl runs for about a day and the portal is somebody
# else's server. At 16 req/s the estimated 1.47 M requests take ~26 hours; at 30
# req/s, ~14 hours. The governor ramps up from a quarter of the ceiling and halves
# on any 429 with a 5 s cooldown across all workers, so raising the ceiling is a
# bet that pays out and self-corrects if the portal disagrees.
#
# Cadence: the repository is public, so Actions minutes are unmetered and the
# crawl is limited by the portal rather than by a CI budget. A 40-minute slice
# every five minutes is roughly 90% duty cycle; `concurrency` below means a slow
# tick delays the next start instead of piling runs on top of each other.

on:
  schedule:
    - cron: "*/5 * * * *"

  # A push that touches the crawler re-validates the tick on real data, and it is
  # the only trigger that can be relied on to fire: this repository went 71 days
  # without a commit before 2026-09-29, past GitHub's 60-day threshold for
  # automatically disabling scheduled workflows, and the schedule above has fired
  # exactly once in its life. A short slice on push keeps that verification cheap.
  push:
    branches: [main]
    paths:
      - "src/lib/census-*.ts"
      - "src/lib/bput-upstream.ts"
      - "scripts/census-tick.mjs"
      - ".github/workflows/census.yml"

  workflow_dispatch:
    inputs:
      years:
        description: Batch years to crawl, e.g. "23,24,25". Empty means all 14.
        required: false
      range_start:
        description: Optional single-range override — first registration number
        required: false
      range_end:
        description: Optional single-range override — last registration number
        required: false
      seconds:
        description: Wall-clock budget for this run, in seconds (job ceiling ~ 20000)
        required: false
        default: "19800"
      max_rps:
        description: Aggregate request ceiling in requests/second (measured safe >35)
        required: false
        default: "16"
      concurrency:
        description: Workers, each walking one college-year block at a time (1–16)
        required: false
        default: "8"
      max_blocks:
        description: Start at most this many blocks this run (0 = no cap)
        required: false
        default: "0"

# One tick at a time. Two overlapping ticks would interleave flushes against the
# same cursors, which is recoverable but pointless. Not cancelling in progress
# means a long dispatch run finishes rather than being cut off by the schedule.
concurrency:
  group: bput-census
  cancel-in-progress: false

permissions:
  contents: read  jobs:
    tick:
      runs-on: ubuntu-latest
      # A job may run for six hours. Since Actions minutes on a public repository
      # are unmetered, and since this repository's cron has proved unreliable (one
      # firing in its entire life), a scheduled run takes a long slice rather than
      # a short one: if the schedule fires twice a day, that is still eleven hours
      # of crawling. Anything killed by this ceiling loses at most the unflushed
      # batch, because the cursor is written every 15 seconds.
      timeout-minutes: 350
    steps:
      # Nothing below is needed to decide whether a crawl is configured, so this
      # runs first and a misconfigured hour costs seconds rather than a checkout.
      - name: Check census credentials
        id: config
        env:
          HAVE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          HAVE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$HAVE_URL" ] && [ -n "$HAVE_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Census credentials missing::Add repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY to begin the crawl."
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configured == 'true'

      # No dependency install: the tick imports only its own TypeScript, so Bun
      # runs it directly and the job stays short. This is also why the workflow is
      # not the place to run W1's test suite — a census tick should not wait on it.
      - uses: oven-sh/setup-bun@v2
        if: steps.config.outputs.configured == 'true'
        with:
          bun-version: latest

      - name: Walk one census slice
        if: steps.config.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CENSUS_YEARS: ${{ inputs.years || vars.CENSUS_YEARS }}
          CENSUS_RANGE_START: ${{ inputs.range_start }}
          CENSUS_RANGE_END: ${{ inputs.range_end }}
          # A push verifies in five minutes; a scheduled run works for five and a
          # half hours; a manual dispatch decides for itself.
          CENSUS_SECONDS: ${{ github.event_name == 'push' && 300 || inputs.seconds || 19800 }}
          CENSUS_MAX_RPS: ${{ inputs.max_rps || '16' }}
          CENSUS_CONCURRENCY: ${{ inputs.concurrency || '8' }}
          CENSUS_ADAPTIVE: ${{ vars.CENSUS_ADAPTIVE || '1' }}
          CENSUS_MAX_BLOCKS: ${{ inputs.max_blocks || '0' }}
        run: bun scripts/census-tick.mjs
