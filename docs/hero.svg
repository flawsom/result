<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="BPUT Result Fetcher, live BPUT semester results, SGPA in seconds, PDF marksheets, no login">
  <title>BPUT Result Fetcher, SGPA in seconds</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="55%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#0b0c14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#1740cc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a2ff0" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#7a2ff0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7a2ff0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="sparkFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.16em}
      .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="240" cy="140" rx="520" ry="360" fill="url(#glowA)"/>
  <ellipse cx="1080" cy="560" rx="460" ry="320" fill="url(#glowB)"/>
  <rect x="20" y="20" width="1240" height="600" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- brand -->
  <g transform="translate(80,86)">
    <rect width="18" height="18" fill="#ffffff"/>
    <text class="m caps" x="34" y="14" font-size="13" fill="#ffffff" font-opacity="0.95">BPUT / RESULT FETCHER</text>
  </g>
  <text class="m caps" x="1200" y="100" font-size="12" fill="#008b1d" text-anchor="end">● LIVE</text>

  <!-- headline -->
  <text class="s" x="78" y="252" font-size="86" font-weight="900" letter-spacing="-2.5" fill="#ffffff">SGPA in</text>
  <text class="s" x="78" y="344" font-size="86" font-weight="900" letter-spacing="-2.5" fill="#ffffff">seconds.</text>
  <text class="s" x="80" y="400" font-size="21" fill="#9aa0ae">Live BPUT semester results, auto-computed SGPA / CGPA</text>
  <text class="s" x="80" y="430" font-size="21" fill="#9aa0ae">and a clean PDF marksheet, registration number only.</text>

  <!-- feature chips -->
  <g class="m caps" font-size="12" fill="#ffffff">
    <rect x="80" y="470" width="126" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="96" y="492">0 ACCOUNTS</text>
    <rect x="218" y="470" width="140" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="234" y="492">8 SEMESTERS</text>
    <rect x="370" y="470" width="152" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="386" y="492">k ≥ 25 ANON</text>
    <rect x="534" y="470" width="152" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="550" y="492">PDF EXPORT</text>
  </g>

  <text class="m" x="80" y="556" font-size="13" fill="#6b7280">Unofficial · not affiliated with BPUT · always verify at results.bput.ac.in</text>

  <!-- glass panel -->
  <rect x="686" y="118" width="520" height="486" fill="url(#glass)" stroke="url(#edge)"/>
  <path d="M686 120h520" stroke="#ffffff" stroke-opacity="0.35"/>

  <!-- result card: faithful rebuild of the real brutalist card -->
  <rect x="712" y="144" width="468" height="352" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text class="m caps" x="738" y="180" font-size="12" fill="#3a3a3a">STUDENT</text>
  <text class="s" x="738" y="212" font-size="27" font-weight="900" letter-spacing="-0.5" fill="#000000">S. PANDA</text>

  <g class="m" font-size="11.5" fill="#000000">
    <text class="caps" x="738" y="243" fill="#3a3a3a">ROLL NO</text><text class="num" x="830" y="243">2301429052</text>
    <text class="caps" x="738" y="263" fill="#3a3a3a">BATCH</text><text class="num" x="830" y="263">2023-27</text>
    <text class="caps" x="738" y="283" fill="#3a3a3a">BRANCH</text><text x="830" y="283">CSE</text>
    <text class="caps" x="738" y="303" fill="#3a3a3a">COLLEGE</text><text x="830" y="303">014 · GCEK</text>
  </g>

  <!-- SGPA band -->
  <rect x="738" y="320" width="416" height="86" fill="#000000"/>
  <text class="m caps" x="758" y="345" font-size="11" fill="#ffffff" fill-opacity="0.7">SEM 3 · ODD-(2024-25)</text>
  <text class="s" x="758" y="386" font-size="22" font-weight="900" fill="#ffffff">SGPA</text>
  <text class="num" x="1132" y="388" font-size="54" font-weight="700" fill="#ffffff" text-anchor="end">8.09</text>

  <!-- mini subject rows -->
  <g class="m" font-size="11">
    <line x1="738" y1="428" x2="1154" y2="428" stroke="#000000"/>
    <text x="738" y="447" fill="#000000">BCS301</text>
    <text x="800" y="447" fill="#3a3a3a">DATA STRUCTURES</text>
    <rect x="1060" y="435" width="24" height="17" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1072" y="448" fill="#000000" text-anchor="middle" font-weight="700">A</text>
    <text x="1120" y="447" fill="#000000" text-anchor="end" font-weight="700">24</text>

    <line x1="738" y1="458" x2="1154" y2="458" stroke="#000000" stroke-opacity="0.25"/>
    <text x="738" y="477" fill="#000000">BCS302</text>
    <text x="800" y="477" fill="#3a3a3a">DISCRETE MATH</text>
    <rect x="1060" y="465" width="24" height="17" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1072" y="478" fill="#000000" text-anchor="middle" font-weight="700">O</text>
    <text x="1120" y="477" fill="#000000" text-anchor="end" font-weight="700">32</text>
  </g>

  <!-- trend sparkline inside the glass panel -->
  <rect x="686" y="524" width="520" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text class="m caps" x="712" y="556" font-size="10.5" fill="#9aa0ae">SGPA TREND · SEMESTER 1 → 8</text>
  <text class="m caps" x="1180" y="556" font-size="10.5" fill="#3b6bff" text-anchor="end">8.09 → 8.04 CGPA</text>
  <g transform="translate(712,566)">
    <path d="M0 26 L66 18 L132 21 L198 11 L264 15 L330 6 L396 9 L462 2 L462 34 L0 34 Z" fill="url(#sparkFill)"/>
    <polyline points="0,26 66,18 132,21 198,11 264,15 330,6 396,9 462,2" fill="none" stroke="#3b6bff" stroke-width="2.5"/>
    <circle cx="462" cy="2" r="4" fill="#ffffff" stroke="#3b6bff" stroke-width="2.5"/>
  </g>
</svg>
