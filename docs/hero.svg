<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="BPUT Result Fetcher: live BPUT semester results, SGPA in seconds, a PDF marksheet, and a self-maintaining census holding 177,393 observations across 1,103 measured college-year ranges, 84 of them read end to end">
  <title>BPUT Result Fetcher, SGPA in seconds, with the live census ledger</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="55%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#0b0c14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#1740cc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a2ff0" stop-opacity="0.4"/>
      <stop offset="75%" stop-color="#7a2ff0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#7a2ff0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:"Archivo Black",Archivo,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.16em}
      .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
      .lbl{font-size:10.5px;fill:#9aa0ae;letter-spacing:.16em}
      .val{font-size:10.5px;fill:#d7dae2;letter-spacing:.08em}
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect width="1280" height="760" fill="url(#grid)"/>
  <ellipse cx="240" cy="140" rx="520" ry="360" fill="url(#glowA)"/>
  <ellipse cx="1080" cy="620" rx="460" ry="320" fill="url(#glowB)"/>
  <rect x="20" y="20" width="1240" height="720" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- brand -->
  <g transform="translate(80,86)">
    <rect width="18" height="18" fill="#ffffff"/>
    <text class="m caps" x="34" y="14" font-size="13" fill="#ffffff">BPUT / RESULT FETCHER</text>
  </g>
  <circle cx="1174" cy="92" r="4" fill="#22c55e"/>
  <text class="m caps" x="1200" y="96" font-size="12" fill="#22c55e" text-anchor="end">LIVE PUSH</text>

  <!-- headline -->
  <text class="s" x="78" y="252" font-size="86" letter-spacing="-2.5" fill="#ffffff">SGPA in</text>
  <text class="s" x="78" y="344" font-size="86" letter-spacing="-2.5" fill="#ffffff">seconds.</text>
  <text class="s" x="80" y="398" font-size="20" fill="#9aa0ae">Live BPUT semester results, auto-computed SGPA / CGPA,</text>
  <text class="s" x="80" y="426" font-size="20" fill="#9aa0ae">a PDF marksheet, and a measured census of the university.</text>

  <!-- feature chips -->
  <g class="m caps" font-size="12" fill="#ffffff">
    <rect x="80" y="462" width="126" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="96" y="484">0 ACCOUNTS</text>
    <rect x="218" y="462" width="140" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="234" y="484">8 SEMESTERS</text>
    <rect x="370" y="462" width="152" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="386" y="484">k ≥ 25 ANON</text>
    <rect x="534" y="462" width="152" height="34" fill="#ffffff" fill-opacity="0.04" stroke="url(#edge)"/>
    <text x="550" y="484">PDF EXPORT</text>
  </g>

  <!-- census ledger meters, live -->
  <text class="m lbl caps" x="80" y="546">CENSUS LEDGER · SELF-MAINTAINING</text>
  <text class="m val caps" x="620" y="546" text-anchor="end">READ 2026-09-30 07:35 UTC</text>

  <text class="m lbl caps" x="80" y="576">PROBE COVERAGE</text>
  <text class="m val caps" x="620" y="576" text-anchor="end">16.15% · 25,932 / 160,600</text>
  <rect x="80" y="582" width="540" height="8" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="80" y="582" width="87" height="8" fill="#3b6bff"/>

  <text class="m lbl caps" x="80" y="618">RANGES READ END TO END</text>
  <text class="m val caps" x="620" y="618" text-anchor="end">7.6% · 84 / 1,103</text>
  <rect x="80" y="624" width="540" height="8" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="80" y="624" width="41" height="8" fill="#22c55e"/>

  <text class="m lbl caps" x="80" y="660">READ BUDGET SPENT + OUTSTANDING</text>
  <text class="m val caps" x="620" y="660" text-anchor="end">13.58% · 203k / 1.5M</text>
  <rect x="80" y="666" width="540" height="8" fill="#ffffff" fill-opacity="0.10"/>
  <rect x="80" y="666" width="73" height="8" fill="#f38500"/>

  <text class="m" x="80" y="702" font-size="11" fill="#6b7280">177,393 observations stored · 142,077 serials never read · 1 semester pass() pending</text>
  <text class="m" x="80" y="726" font-size="11" fill="#6b7280">Unofficial · not affiliated with BPUT · always verify at results.bput.ac.in</text>

  <!-- glass panel -->
  <rect x="686" y="118" width="520" height="610" fill="url(#glass)" stroke="url(#edge)"/>
  <path d="M686 120h520" stroke="#ffffff" stroke-opacity="0.35"/>

  <!-- result card -->
  <rect x="712" y="144" width="468" height="330" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text class="m caps" x="738" y="180" font-size="12" fill="#3a3a3a">STUDENT</text>
  <text class="s" x="738" y="212" font-size="27" letter-spacing="-0.5" fill="#000000">S. PANDA</text>

  <g class="m" font-size="11.5" fill="#000000">
    <text class="caps" x="738" y="243" fill="#3a3a3a">ROLL NO</text><text class="num" x="830" y="243">2301429052</text>
    <text class="caps" x="738" y="263" fill="#3a3a3a">BATCH</text><text class="num" x="830" y="263">2023-27</text>
    <text class="caps" x="738" y="283" fill="#3a3a3a">BRANCH</text><text x="830" y="283">CSE</text>
    <text class="caps" x="738" y="303" fill="#3a3a3a">COLLEGE</text><text x="830" y="303">014 · GCEK</text>
  </g>

  <rect x="738" y="320" width="416" height="86" fill="#000000"/>
  <text class="m caps" x="758" y="345" font-size="11" fill="#ffffff" fill-opacity="0.7">SEM 3 · ODD-(2024-25)</text>
  <text class="s" x="758" y="386" font-size="22" fill="#ffffff">SGPA</text>
  <text class="num" x="1132" y="388" font-size="54" fill="#ffffff" text-anchor="end">8.09</text>

  <g class="m" font-size="11">
    <line x1="738" y1="428" x2="1154" y2="428" stroke="#000000"/>
    <text x="738" y="447" fill="#000000">BCS301</text>
    <text x="800" y="447" fill="#3a3a3a">DATA STRUCTURES</text>
    <rect x="1060" y="435" width="24" height="17" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1072" y="448" fill="#000000" text-anchor="middle" font-weight="700">A</text>
    <text x="1120" y="447" fill="#000000" text-anchor="end" font-weight="700">24</text>
    <line x1="738" y1="458" x2="1154" y2="458" stroke="#000000" stroke-opacity="0.25"/>
    <text x="738" y="477" fill="#000000">BCS302</text>
    <text x="800" y="477" fill="#3a3a3a">DISCRETE MATH</text>
    <rect x="1060" y="465" width="24" height="17" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="1072" y="478" fill="#000000" text-anchor="middle" font-weight="700">O</text>
    <text x="1120" y="477" fill="#000000" text-anchor="end" font-weight="700">32</text>
  </g>

  <!-- census card -->
  <rect x="712" y="494" width="468" height="206" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="736" y="520" font-size="10.5" fill="#3a3a3a">MEASURED UNIVERSE · CENSUS LEDGER</text>
  <text class="m" x="1148" y="520" font-size="9.5" fill="#008b1d" text-anchor="end">LIVE PUSH</text>
  <line x1="736" y1="530" x2="1156" y2="530" stroke="#000000" stroke-opacity="0.25"/>

  <text class="num" x="736" y="576" font-size="40" font-weight="700" fill="#000000">1,103</text>
  <text class="m caps" x="736" y="596" font-size="9.5" fill="#3a3a3a">COLLEGE-AND-YEAR RANGES MEASURED</text>
  <text class="m" x="736" y="616" font-size="9.5" fill="#3a3a3a">160,609 registration numbers declared, each probed one</text>
  <text class="m" x="736" y="630" font-size="9.5" fill="#3a3a3a">at a time. Never sampled, never extrapolated.</text>

  <line x1="940" y1="540" x2="940" y2="688" stroke="#000000" stroke-opacity="0.15"/>

  <text class="m caps" x="964" y="556" font-size="9.5" fill="#3a3a3a">OBSERVATIONS STORED</text>
  <text class="num" x="964" y="580" font-size="20" font-weight="700" fill="#000000">177,393</text>
  <text class="m caps" x="964" y="604" font-size="9.5" fill="#3a3a3a">NUMBERS PROBED</text>
  <text class="num" x="964" y="628" font-size="20" font-weight="700" fill="#000000">25,932</text>
  <text class="m caps" x="964" y="652" font-size="9.5" fill="#3a3a3a">READS LEFT, ESTIMATED</text>
  <text class="num" x="964" y="676" font-size="20" font-weight="700" fill="#000000">1.3M</text>
</svg>
