<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-label="Authentication screen: Admin sign in with a Continue with Google button, an email and password form, and a note that sign-up is disabled">
  <title>Authentication — /auth, admin sign-in with Google and email/password</title>
  <defs>
    <pattern id="agrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#000000" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.15em}
    </style>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>
  <rect width="1100" height="700" fill="url(#agrid)"/>

  <g transform="translate(56,52)">
    <rect width="22" height="22" fill="#000000"/>
    <text class="m caps" x="38" y="16" font-size="11" fill="#000000">BPUT / RESULT FETCHER</text>
  </g>
  <text class="m caps" x="1044" y="68" font-size="11" fill="#3a3a3a" text-anchor="end">ROBOTS: NOINDEX</text>

  <!-- sign-in card -->
  <rect x="330" y="118" width="440" height="470" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <text class="s" x="550" y="182" font-size="26" font-weight="900" letter-spacing="-0.5" fill="#000000" text-anchor="middle">Admin sign in</text>
  <text class="s" x="550" y="212" font-size="12.5" fill="#3a3a3a" text-anchor="middle">Restricted surface. The public results tool is at</text>
  <text class="s" x="550" y="230" font-size="12.5" fill="#1000c9" text-anchor="middle">/</text>

  <!-- Google button -->
  <rect x="366" y="256" width="368" height="50" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <g transform="translate(0,0)" fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M389.5 282.9A9 9 0 0 1 404.9 280.2" stroke="#EA4335"/>
    <path d="M404.9 280.2A9 9 0 0 1 404.4 292.4" stroke="#4285F4"/>
    <path d="M404.4 292.4A9 9 0 0 1 392.2 292.9" stroke="#34A853"/>
    <path d="M392.2 292.9A9 9 0 0 1 389.5 282.9" stroke="#FBBC05"/>
  </g>
  <rect x="398" y="284.5" width="10" height="3.4" fill="#4285F4"/>
  <text class="s" x="550" y="288" font-size="14" fill="#000000" text-anchor="middle">Continue with Google</text>

  <!-- divider -->
  <line x1="366" y1="336" x2="510" y2="336" stroke="#000000" stroke-opacity="0.35"/>
  <line x1="590" y1="336" x2="734" y2="336" stroke="#000000" stroke-opacity="0.35"/>
  <rect x="524" y="325" width="52" height="22" fill="#ffffff"/>
  <text class="m caps" x="550" y="340" font-size="10" fill="#3a3a3a" text-anchor="middle">OR</text>

  <!-- email -->
  <text class="m caps" x="366" y="382" font-size="10.5" fill="#000000">EMAIL</text>
  <rect x="366" y="392" width="368" height="46" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="s" x="384" y="420" font-size="13.5" fill="#3a3a3a">admin@college.edu</text>

  <!-- password -->
  <text class="m caps" x="366" y="470" font-size="10.5" fill="#000000">PASSWORD</text>
  <rect x="366" y="480" width="368" height="46" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <g fill="#3a3a3a">
    <circle cx="388" cy="503" r="3"/><circle cx="400" cy="503" r="3"/><circle cx="412" cy="503" r="3"/>
    <circle cx="424" cy="503" r="3"/><circle cx="436" cy="503" r="3"/><circle cx="448" cy="503" r="3"/>
    <circle cx="460" cy="503" r="3"/><circle cx="472" cy="503" r="3"/>
  </g>

  <rect x="366" y="544" width="368" height="48" fill="#000000" stroke="#000000" stroke-width="3"/>
  <text class="s" x="550" y="574" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">Sign in</text>

  <text class="s" x="550" y="624" font-size="11.5" fill="#3a3a3a" text-anchor="middle">Sign-up is disabled. Contact an existing admin to be added.</text>

  <text class="m" x="550" y="656" font-size="11" fill="#3a3a3a" text-anchor="middle">SIGNED-IN USERS ARE REDIRECTED TO /ADMIN</text>
</svg>
