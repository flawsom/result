<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="Mobile view of BPUT Result Fetcher: the registration-number form and a published semester block with its SGPA on a 390 pixel wide screen">
  <title>Mobile — registration-number lookup and a semester SGPA block</title>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1d22"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.15em}
      .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    </style>
  </defs>

  <rect width="390" height="844" rx="46" fill="url(#bezel)"/>
  <rect x="11" y="11" width="368" height="822" rx="36" fill="#ffffff"/>
  <rect x="0" y="0" width="390" height="844" rx="46" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="2"/>

  <!-- status bar -->
  <text class="m" x="38" y="42" font-size="12" fill="#000000">9:41</text>
  <rect x="300" y="35" width="18" height="9" rx="2" fill="#000000"/>
  <rect x="322" y="34" width="12" height="11" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <rect x="336" y="36" width="11" height="7" rx="1" fill="#000000"/>

  <!-- app header -->
  <g transform="translate(26,74)">
    <rect width="32" height="32" fill="#000000" stroke="#000000" stroke-width="3"/>
    <text class="m caps" x="46" y="12" font-size="10" fill="#000000">BPUT / RESULT FETCHER</text>
    <text class="s" x="46" y="31" font-size="15" font-weight="900" letter-spacing="-0.2" fill="#000000">results.bput.ac.in</text>
  </g>
  <rect x="0" y="118" width="390" height="3" fill="#000000"/>

  <!-- headline -->
  <text class="s" x="26" y="188" font-size="32" font-weight="900" letter-spacing="-0.9" fill="#000000">FETCH YOUR</text>
  <text class="s" x="26" y="220" font-size="32" font-weight="900" letter-spacing="-0.9" fill="#000000">BPUT RESULT.</text>
  <text class="s" x="26" y="248" font-size="12" fill="#3a3a3a">Registration number only. All 8 semester</text>
  <text class="s" x="26" y="265" font-size="12" fill="#3a3a3a">sessions are derived from your batch year.</text>

  <!-- form -->
  <rect x="26" y="288" width="338" height="168" fill="#ffffff" stroke="#000000" stroke-width="4"/>
  <text class="m caps" x="44" y="318" font-size="10" fill="#000000">REGISTRATION NUMBER</text>
  <rect x="44" y="330" width="302" height="56" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="num" x="58" y="365" font-size="19" fill="#000000">2301429052</text>
  <rect x="316" y="346" width="2" height="26" fill="#1000c9"/>
  <rect x="44" y="398" width="302" height="42" fill="#000000" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="195" y="424" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">FETCH RESULT</text>

  <!-- semester block -->
  <text class="m caps" x="26" y="498" font-size="10" fill="#3a3a3a">SEMESTER 3 · ODD-(2024-25)</text>
  <rect x="26" y="512" width="338" height="86" fill="#000000"/>
  <text class="m caps" x="44" y="536" font-size="10" fill="#ffffff" fill-opacity="0.7">2301429052 · 3RD SEMESTER</text>
  <text class="s" x="44" y="576" font-size="20" font-weight="900" fill="#ffffff">SGPA</text>
  <text class="num" x="346" y="580" font-size="44" font-weight="700" fill="#ffffff" text-anchor="end">8.09</text>

  <rect x="26" y="598" width="338" height="2" fill="#000000"/>
  <g class="m" font-size="10">
    <text x="34" y="624" fill="#000000">BCS301</text>
    <text x="96" y="624" fill="#3a3a3a">DATA STRUCTURES</text>
    <rect x="300" y="612" width="22" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="311" y="625" fill="#000000" text-anchor="middle" font-weight="700">A</text>
    <text x="352" y="624" fill="#000000" text-anchor="end" font-weight="700">24</text>
    <line x1="26" y1="638" x2="364" y2="638" stroke="#000000" stroke-opacity="0.2"/>
    <text x="34" y="658" fill="#000000">BCS302</text>
    <text x="96" y="658" fill="#3a3a3a">DISCRETE MATH</text>
    <rect x="300" y="646" width="22" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="311" y="659" fill="#000000" text-anchor="middle" font-weight="700">O</text>
    <text x="352" y="658" fill="#000000" text-anchor="end" font-weight="700">32</text>
    <line x1="26" y1="672" x2="364" y2="672" stroke="#000000" stroke-opacity="0.2"/>
    <text x="34" y="692" fill="#000000">BCS303</text>
    <text x="96" y="692" fill="#3a3a3a">DIGITAL ELECTRONICS</text>
    <rect x="300" y="680" width="22" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <text x="311" y="693" fill="#000000" text-anchor="middle" font-weight="700">B</text>
    <text x="352" y="692" fill="#000000" text-anchor="end" font-weight="700">21</text>
  </g>

  <!-- CGPA band -->
  <rect x="26" y="712" width="338" height="72" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text class="m caps" x="44" y="736" font-size="10" fill="#3a3a3a">CUMULATIVE · 3 PUBLISHED SEMESTERS</text>
  <text class="s" x="44" y="768" font-size="18" font-weight="900" fill="#000000">CGPA</text>
  <text class="num" x="346" y="772" font-size="38" font-weight="700" fill="#000000" text-anchor="end">8.04</text>

  <text class="m" x="26" y="812" font-size="9" fill="#3a3a3a">UNOFFICIAL · VERIFY AT RESULTS.BPUT.AC.IN</text>
</svg>
