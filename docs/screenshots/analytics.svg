      <text class="m" x="111" y="14" font-size="9.5" fill="#3a3a3a" text-anchor="end">4.1k</text>
      <path d="M4 30 Q30 30 50 20 T116 24 L116 30 L4 30 Z" fill="url(#spark1)"/>
      <path d="M4 30 Q30 30 50 20 T116 24" fill="none" stroke="#000000" stroke-width="1.8"/>
