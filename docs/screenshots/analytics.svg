      <text class="m" x="111" y="14" font-size="9.5" fill="#1740cc" text-anchor="end">4.9k</text>
      <path d="M4 30 Q30 30 50 16 T116 22 L116 30 L4 30 Z" fill="url(#spark1)"/>
