<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-label="BPUT Results Intelligence dashboard: all-time total with year-over-year change, a 24 hour live pulse, a year-wise volume area chart with a peak annotation, k-anonymised branch distribution lollipops, a year selector and per-semester density sparklines">
  <title>Analytics, BPUT Results Intelligence</title>
  <defs>
    <linearGradient id="volFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#000000" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.15em}
      .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="44" fill="#0a0a0a"/>
  <circle cx="26" cy="22" r="5" fill="#4b5563"/><circle cx="44" cy="22" r="5" fill="#4b5563"/><circle cx="62" cy="22" r="5" fill="#4b5563"/>
  <rect x="96" y="12" width="1010" height="21" fill="#16181d" stroke="#23262e"/>
  <text class="m" x="601" y="27" font-size="11" fill="#9aa0ae" text-anchor="middle">result.unifies.codes</text>

  <g transform="translate(88,62)">
    <rect width="40" height="40" fill="#000000" stroke="#000000" stroke-width="3"/>
    <text class="m caps" x="58" y="15" font-size="12" fill="#000000">BPUT / RESULT FETCHER</text>
    <text class="s" x="58" y="40" font-size="20" font-weight="900" letter-spacing="-0.3" fill="#000000">results.bput.ac.in</text>
  </g>
  <text class="m caps" x="1112" y="90" font-size="11" fill="#3a3a3a" text-anchor="end">v1.0 // LIVE</text>
  <rect x="0" y="114" width="1200" height="5" fill="#000000"/>

  <!-- section header -->
  <rect x="88" y="152" width="1024" height="4" fill="#000000"/>
  <text class="m caps" x="88" y="188" font-size="12" fill="#3a3a3a">SYSTEM DIAGNOSTICS // ANALYTICS ENGINE</text>
  <text class="s" x="86" y="238" font-size="44" font-weight="900" letter-spacing="-1.2" fill="#000000">BPUT RESULTS</text>
  <text class="s" x="86" y="284" font-size="44" font-weight="900" letter-spacing="-1.2" fill="#000000">INTELLIGENCE.</text>
  <circle cx="1084" cy="186" r="5" fill="#008b1d"/>
  <circle cx="1084" cy="186" r="10" fill="#008b1d" fill-opacity="0.22"/>
  <text class="m caps" x="1112" y="190" font-size="11" fill="#3a3a3a" text-anchor="end">LIVE STREAM</text>
  <text class="m caps" x="1112" y="208" font-size="11" fill="#3a3a3a" text-anchor="end">AUTO-REFRESH · 30S</text>

  <!-- row 1: total + pulse -->
  <rect x="88" y="312" width="660" height="108" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="112" y="338" font-size="11" fill="#3a3a3a">TOTAL RECORDS SCOPED · ALL-TIME</text>
  <text class="m caps" x="724" y="338" font-size="11" fill="#1740cc" text-anchor="end">▲ 18.4% YOY</text>
  <text class="num" x="112" y="388" font-size="46" font-weight="700" fill="#000000">48,284</text>
  <path d="M400 384 L452 372 L504 378 L556 358 L608 364 L660 346 L712 350 L724 344 L724 400 L400 400 Z" fill="url(#spark1)"/>
  <polyline points="400,384 452,372 504,378 556,358 608,364 660,346 712,350 724,344" fill="none" stroke="#1740cc" stroke-width="2"/>

  <rect x="764" y="312" width="348" height="108" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="786" y="338" font-size="11" fill="#3a3a3a">LIVE PULSE · 24H</text>
  <text class="num" x="786" y="380" font-size="38" font-weight="700" fill="#000000">17</text>
  <text class="m caps" x="786" y="400" font-size="10.5" fill="#3a3a3a">DISTINCT SEMESTERS</text>
  <line x1="940" y1="352" x2="940" y2="404" stroke="#000000" stroke-opacity="0.15"/>
  <text class="num" x="964" y="378" font-size="26" font-weight="700" fill="#000000">342</text>
  <text class="m caps" x="964" y="398" font-size="10.5" fill="#3a3a3a">TOTAL LOOKUPS</text>

  <!-- row 2: volume density -->
  <text class="m caps" x="88" y="450" font-size="11" fill="#000000">VOLUME DENSITY / 2019–2026</text>
  <text class="m caps" x="452" y="450" font-size="10" fill="#3a3a3a">■ VOLUME</text>
  <text class="m caps" x="540" y="450" font-size="10" fill="#3a3a3a">TREND</text>
  <rect x="88" y="458" width="660" height="200" fill="#f7f8fb" stroke="#000000" stroke-width="3"/>
  <rect x="91" y="461" width="654" height="194" fill="url(#vgrid)"/>
  <ellipse cx="430" cy="560" rx="220" ry="120" fill="url(#spot)"/>
  <g stroke="#000000" stroke-opacity="0.14" stroke-dasharray="3 4">
