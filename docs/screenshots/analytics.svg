    <rect x="428" y="716" width="58" height="22" fill="#ffffff" stroke="#000000" stroke-opacity="0.2"/><text x="457" y="731" fill="#000000" text-anchor="middle">2024</text>
    <rect x="492" y="716" width="58" height="22" fill="#ffffff" stroke="#000000" stroke-opacity="0.2"/><text x="521" y="731" fill="#000000" text-anchor="middle">2025</text>
    <rect x="556" y="716" width="58" height="22" fill="#000000"/><text x="585" y="731" fill="#ffffff" text-anchor="middle">2026</text>
    <text x="628" y="731" fill="#3a3a3a">128,884 · 44,102 · 61,233 · … · 18,404</text>
  </g>

