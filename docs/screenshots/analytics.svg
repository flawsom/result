  <circle cx="656" cy="536" r="5" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <rect x="100" y="470" width="132" height="34" fill="#000000"/>
  <text class="m" x="110" y="484" font-size="10" fill="#ffffff" font-weight="700">PEAK · 2024</text>
  <text class="m" x="110" y="497" font-size="9.5" fill="#ffffff" fill-opacity="0.8">12,884 RECORDS</text>
