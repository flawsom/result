<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-label="Desktop view of BPUT Result Fetcher: the home page showing the registration-number search form above the live BPUT Results Intelligence dashboard, which opens with the measured intake, college size and census coverage panels">
  <title>Desktop, home page with result lookup and the BPUT Results Intelligence dashboard</title>
  <defs>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1740cc" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1740cc" stop-opacity="0"/>
    </linearGradient>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .s{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
      .caps{letter-spacing:.15em}
      .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#ffffff"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="44" fill="#0a0a0a"/>
  <circle cx="26" cy="22" r="5" fill="#4b5563"/><circle cx="44" cy="22" r="5" fill="#4b5563"/><circle cx="62" cy="22" r="5" fill="#4b5563"/>
  <rect x="96" y="12" width="1010" height="21" fill="#16181d" stroke="#23262e"/>
  <text class="m" x="601" y="27" font-size="11" fill="#9aa0ae" text-anchor="middle">result.unifies.codes</text>

  <!-- app header -->
  <g transform="translate(88,62)">
    <rect width="40" height="40" fill="#000000" stroke="#000000" stroke-width="3"/>
    <text class="m caps" x="58" y="15" font-size="12" fill="#000000">BPUT / RESULT FETCHER</text>
    <text class="s" x="58" y="40" font-size="20" font-weight="900" letter-spacing="-0.3" fill="#000000">results.bput.ac.in</text>
  </g>
  <rect x="928" y="66" width="150" height="38" fill="none" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="1003" y="90" font-size="11" fill="#000000" text-anchor="middle">NEED BULK ACCESS ?</text>
  <text class="m caps" x="1112" y="90" font-size="11" fill="#3a3a3a" text-anchor="end">v1.1 // LEDGER</text>
  <rect x="0" y="114" width="1200" height="5" fill="#000000"/>

  <!-- headline -->
  <text class="s" x="86" y="216" font-size="56" font-weight="900" letter-spacing="-1.4" fill="#000000">FETCH YOUR</text>
  <text class="s" x="86" y="272" font-size="56" font-weight="900" letter-spacing="-1.4" fill="#000000">BPUT RESULT.</text>
  <text class="s" x="88" y="308" font-size="15" fill="#3a3a3a">Enter your registration number. We derive all 8 semester sessions from your batch year</text>
  <text class="s" x="88" y="330" font-size="15" fill="#3a3a3a">and pull each published semester directly, no DOB or session input required.</text>

  <!-- search form -->
  <rect x="88" y="368" width="1024" height="226" fill="#ffffff" stroke="#000000" stroke-width="5"/>
  <text class="m caps" x="120" y="406" font-size="12" fill="#000000">REGISTRATION NUMBER</text>
  <rect x="120" y="420" width="960" height="72" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text class="num" x="142" y="464" font-size="26" fill="#000000">2301429052</text>
  <rect x="848" y="438" width="2" height="36" fill="#1000c9"/>
  <rect x="120" y="512" width="196" height="52" fill="#000000" stroke="#000000" stroke-width="3"/>
  <text class="m caps" x="218" y="545" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">FETCH RESULT</text>
  <text class="m caps" x="338" y="545" font-size="12" fill="#3a3a3a">LIVE · NO ACCOUNTS · REG NO ONLY</text>

  <!-- analytics section header (border-b-4, exactly as the app renders it) -->
  <rect x="88" y="640" width="1024" height="4" fill="#000000"/>
  <text class="m caps" x="88" y="676" font-size="12" fill="#3a3a3a">SYSTEM DIAGNOSTICS // ANALYTICS ENGINE</text>
  <text class="s" x="86" y="716" font-size="34" font-weight="900" letter-spacing="-0.8" fill="#000000">BPUT RESULTS INTELLIGENCE.</text>
  <circle cx="1096" cy="666" r="5" fill="#008b1d"/>
  <circle cx="1096" cy="666" r="9" fill="#008b1d" fill-opacity="0.25"/>
  <text class="m caps" x="1112" y="670" font-size="11" fill="#3a3a3a" text-anchor="end">LIVE STREAM · AUTO-REFRESH 30s</text>

  <!-- panel 01 teaser -->
  <rect x="88" y="740" width="328" height="132" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="88" y="740" width="22" height="22" fill="#000000"/>
  <text class="m" x="99" y="756" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">01</text>
  <text class="m caps" x="120" y="756" font-size="10.5" fill="#000000">MEASURED INTAKE BY BATCH YEAR</text>
  <rect x="104" y="770" width="296" height="86" fill="#f7f8fb" stroke="#000000" stroke-opacity="0.3"/>
  <g>
    <rect x="112" y="782" width="16" height="66" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="134" y="792" width="16" height="56" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="156" y="802" width="16" height="46" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="178" y="790" width="16" height="58" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="200" y="794" width="16" height="54" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="222" y="812" width="16" height="36" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="244" y="822" width="16" height="26" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="266" y="826" width="16" height="22" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="288" y="830" width="16" height="18" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="310" y="818" width="16" height="30" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="332" y="806" width="16" height="42" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="354" y="798" width="16" height="50" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
    <rect x="376" y="788" width="16" height="60" fill="#1740cc" fill-opacity="0.15" stroke="#1740cc" stroke-width="1.5"/>
  </g>
  <text class="m caps" x="112" y="866" font-size="9.5" fill="#000000">1,103 RANGES · 160,609 NUMBERS · 158,571 STUDENTS</text>

  <!-- panel 02 teaser -->
  <rect x="434" y="740" width="328" height="132" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="434" y="740" width="22" height="22" fill="#000000"/>
  <text class="m" x="445" y="756" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">02</text>
  <text class="m caps" x="466" y="756" font-size="10.5" fill="#000000">COLLEGE SIZE ACROSS THE GRID</text>
  <g class="m" font-size="10">
    <text x="450" y="786" fill="#3a3a3a">MEDIAN COLLEGE</text><text x="746" y="786" fill="#000000" text-anchor="end" font-weight="700">91</text>
    <text x="450" y="812" fill="#3a3a3a">MEAN COLLEGE</text><text x="746" y="812" fill="#000000" text-anchor="end" font-weight="700">145.6</text>
    <text x="450" y="838" fill="#3a3a3a">GINI</text><text x="746" y="838" fill="#000000" text-anchor="end" font-weight="700">0.526</text>
    <text x="450" y="864" fill="#3a3a3a">TOP DECILE SHARE</text><text x="746" y="864" fill="#1740cc" text-anchor="end" font-weight="700">36%</text>
  </g>
  <line x1="450" y1="794" x2="746" y2="794" stroke="#000000" stroke-opacity="0.12"/>
  <line x1="450" y1="820" x2="746" y2="820" stroke="#000000" stroke-opacity="0.12"/>
  <line x1="450" y1="846" x2="746" y2="846" stroke="#000000" stroke-opacity="0.12"/>

  <!-- panel 03 teaser -->
  <rect x="780" y="740" width="332" height="132" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <rect x="780" y="740" width="22" height="22" fill="#000000"/>
  <text class="m" x="791" y="756" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">03</text>
  <text class="m caps" x="812" y="756" font-size="10.5" fill="#000000">CENSUS COVERAGE &amp; YIELD</text>
  <circle cx="1052" cy="752" r="4" fill="#008b1d"/>
  <text class="m caps" x="1096" y="756" font-size="9" fill="#008b1d" text-anchor="end">LIVE PUSH</text>
  <g class="m" font-size="10">
    <text x="796" y="786" fill="#3a3a3a">NUMBERS PROBED</text><text x="1096" y="786" fill="#000000" text-anchor="end" font-weight="700">25,932</text>
    <text x="796" y="812" fill="#3a3a3a">OBSERVATIONS STORED</text><text x="1096" y="812" fill="#000000" text-anchor="end" font-weight="700">177,393</text>
    <text x="796" y="838" fill="#3a3a3a">RANGES READ END TO END</text><text x="1096" y="838" fill="#000000" text-anchor="end" font-weight="700">84 / 1,103</text>
    <text x="796" y="864" fill="#3a3a3a">READS LEFT, ESTIMATED</text><text x="1096" y="864" fill="#000000" text-anchor="end" font-weight="700">1.3M</text>
  </g>
  <line x1="796" y1="794" x2="1096" y2="794" stroke="#000000" stroke-opacity="0.12"/>
  <line x1="796" y1="820" x2="1096" y2="820" stroke="#000000" stroke-opacity="0.12"/>
  <line x1="796" y1="846" x2="1096" y2="846" stroke="#000000" stroke-opacity="0.12"/>

  <text class="m caps" x="88" y="892" font-size="10" fill="#3a3a3a">THREE PANELS ABOUT THE UNIVERSITY, EIGHT ABOUT THIS DEPLOYMENT · EVERY FIGURE FROM THE LIVE LEDGER</text>
</svg>
